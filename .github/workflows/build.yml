name: Build installer

# - Tag "v*" (es. v0.1.0): compila l'installer e lo pubblica nelle Release.
# - "Run workflow" manuale: compila l'installer e lo lascia tra gli artifact,
#   utile per provarlo prima di pubblicare.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $v = python -c "import glucobar; print(glucobar.__version__)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build GlucoBar.exe
        run: pyinstaller --noconfirm --clean glucobar.spec

      - name: Smoke test
        shell: pwsh
        run: |
          # exe senza console: va aspettato esplicitamente
          $p = Start-Process dist\GlucoBar\GlucoBar.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:APPDATA\GlucoBar\glucobar.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Installer previews
        run: python tools/previews_to_bmp.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" `
                  "/DRepoUrl=${{ github.server_url }}/${{ github.repository }}" `
                  installer\glucobar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: GlucoBar-Setup-${{ steps.version.outputs.version }}
          path: dist-installer/*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist-installer/*.exe
          generate_release_notes: true
