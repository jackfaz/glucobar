name: Build installer

# - Tag "v*" (es. v0.1.0): compila l'installer e lo pubblica nelle Release.
# - "Run workflow" manuale: compila l'installer e lo lascia tra gli artifact,
#   utile per provarlo prima di pubblicare.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $v = python -c "import glucobar; print(glucobar.__version__)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Changelog has this version
        run: python tools/release_notes.py ${{ steps.version.outputs.version }}

      - name: Build GlucoBar.exe
        run: pyinstaller --noconfirm --clean glucobar.spec

      - name: Smoke test
        shell: pwsh
        run: |
          # exe senza console: va aspettato esplicitamente
          $p = Start-Process dist\GlucoBar\GlucoBar.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:APPDATA\GlucoBar\glucobar.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Installer previews
        run: python tools/previews_to_bmp.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" `
                  "/DRepoUrl=${{ github.server_url }}/${{ github.repository }}" `
                  installer\glucobar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Compilare non basta: l'installer va anche avviato (la 0.3.0 compilava ma si
      # bloccava all'avvio con "Could not call proc")
      - name: Installer test (install, check, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
               "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/LOG=$log"
          Get-Content $log -Tail 25
          if ($p.ExitCode -ne 0) { throw "installazione fallita (codice $($p.ExitCode))" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\GlucoBar"
          if (-not (Test-Path "$dir\GlucoBar.exe")) { throw "GlucoBar.exe non installato" }
          $cfg = Get-Content "$env:APPDATA\GlucoBar\config.json" -Raw | ConvertFrom-Json
          "elementi salvati: $($cfg.elements -join ',')   lingua: $($cfg.language)"
          if (($cfg.elements -join ',') -ne 'taskbar,tray') { throw "scelte non salvate" }

          # "Cancella tutto" deve cancellare davvero la password (0.3.0: tornava
          # dal file in chiaro della prima versione)
          cmdkey /generic:GlucoBar:LibreLinkUp /user:test@example.com /pass:segreta | Out-Null
          '{"email": "test@example.com", "password": "in-chiaro"}' |
              Set-Content "$env:USERPROFILE\.glicemia_widget.json"
          $f = Start-Process "$dir\GlucoBar.exe" -ArgumentList "--forget" -Wait -PassThru
          if ($f.ExitCode -ne 0) { throw "--forget fallito (codice $($f.ExitCode))" }
          $left = cmdkey /list:GlucoBar:LibreLinkUp | Out-String
          if ($left -match "test@example.com") { throw "password ancora nel Gestione credenziali" }
          if (Test-Path "$env:APPDATA\GlucoBar") { throw "impostazioni non cancellate" }
          if (Test-Path "$env:USERPROFILE\.glicemia_widget.json") { throw "file della prima versione non cancellato" }
          "--forget ok: password, impostazioni e vecchio file cancellati"
          $u = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList `
               "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($u.ExitCode -ne 0) { throw "disinstallazione fallita (codice $($u.ExitCode))" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\GlucoBar.exe") { throw "GlucoBar.exe ancora presente dopo la disinstallazione" }
          "installazione e disinstallazione ok"

      - uses: actions/upload-artifact@v7
        with:
          name: GlucoBar-Setup-${{ steps.version.outputs.version }}
          path: dist-installer/*.exe

      - name: Release notes
        if: github.ref_type == 'tag'
        run: python tools/release_notes.py ${{ steps.version.outputs.version }} release-notes.md

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist-installer/*.exe
          body_path: release-notes.md
