name: Build installer

# - Tag "v*" (es. v0.1.0): compila l'installer e lo pubblica nelle Release.
# - "Run workflow" manuale: compila l'installer e lo lascia tra gli artifact,
#   utile per provarlo prima di pubblicare. Spuntando "release" pubblica anche la
#   versione scritta in glucobar/__init__.py (il tag v... lo crea GitHub).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the version in glucobar/__init__.py"
        type: boolean
        default: false
      scan:
        description: "Scan the installer on VirusTotal even without publishing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # PyInstaller compilato qui, bootloader compreso: quello precompilato è lo stesso
      # usato da molti malware e fa scattare i falsi positivi (es. Windows Defender)
      - name: Install dependencies
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install --no-binary pyinstaller "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $boot = python -c "import os, PyInstaller; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel', 'runw.exe'))"
          "::notice title=Bootloader::runw.exe $((Get-FileHash $boot).Hash)"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $v = python -c "import glucobar; print(glucobar.__version__)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Changelog has this version
        run: python tools/release_notes.py ${{ steps.version.outputs.version }}

      - name: Build GlucoBar.exe
        run: pyinstaller --noconfirm --clean glucobar.spec

      - name: Smoke test
        shell: pwsh
        run: |
          # exe senza console: va aspettato esplicitamente
          $p = Start-Process dist\GlucoBar\GlucoBar.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:APPDATA\GlucoBar\glucobar.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          # il comando da terminale (ha la console: PowerShell lo aspetta da solo)
          $v = dist\GlucoBar\glucobar-cli.exe --version
          "glucobar-cli: $v"
          if ($LASTEXITCODE -ne 0 -or $v -notmatch "GlucoBar") { exit 1 }
          # nome e versione nelle Proprietà dei file
          foreach ($exe in "GlucoBar.exe", "glucobar-cli.exe") {
            $info = (Get-Item "dist\GlucoBar\$exe").VersionInfo
            "${exe}: $($info.ProductName) $($info.ProductVersion), $($info.FileDescription)"
            if ($info.ProductName -ne "GlucoBar" -or
                $info.ProductVersion -ne "${{ steps.version.outputs.version }}") { exit 1 }
          }

      - name: Installer previews
        run: python tools/previews_to_bmp.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" `
                  "/DRepoUrl=${{ github.server_url }}/${{ github.repository }}" `
                  installer\glucobar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Compilare non basta: l'installer va anche avviato (la 0.3.0 compilava ma si
      # bloccava all'avvio con "Could not call proc")
      - name: Installer test (install, check, uninstall)
        shell: pwsh
        run: |
          function Check($ok, $msg) { if (-not $ok) { throw $msg } else { "ok: $msg" } }
          $setup = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          # installazione silenziosa con scelte, come farà winget
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
               "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", `
               "/ELEMENTS=desktop,tray", "/SENSOR=dexcom", "/LANG=de", "/LOG=$log"
          Get-Content $log -Tail 15
          Check ($p.ExitCode -eq 0) "installazione (codice $($p.ExitCode))"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\GlucoBar"
          Check (Test-Path "$dir\GlucoBar.exe") "GlucoBar.exe installato"
          $cfg = Get-Content "$env:APPDATA\GlucoBar\config.json" -Raw | ConvertFrom-Json
          Check (($cfg.elements -join ',') -eq 'tray,desktop') "/ELEMENTS salvato ($($cfg.elements -join ','))"
          Check ($cfg.language -eq 'de') "/LANG salvato ($($cfg.language))"
          Check ($cfg.source -eq 'dexcom') "/SENSOR salvato ($($cfg.source))"

          # il comando "glucobar"
          $gb = "$dir\bin\glucobar.cmd"
          & $gb set unit=mmol/L low=80
          Check ($LASTEXITCODE -eq 0) "glucobar set"
          $out = & $gb get unit low | Out-String
          Check ($out -match "unit = mmol/L" -and $out -match "low = 80") "glucobar get"
          & $gb set low=999 2>$null
          Check ($LASTEXITCODE -eq 2) "glucobar set rifiuta valori sbagliati"
          & $gb status | Out-Null
          Check ($LASTEXITCODE -eq 1) "glucobar status senza account"
          $path = (Get-ItemProperty HKCU:\Environment).Path
          Check ($path -like "*$dir\bin*") "bin nel PATH dell'utente"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          Check ((Get-ItemProperty $run).GlucoBar -like "*GlucoBar.exe*") "avvio con Windows attivo"
          & $gb set autostart=false | Out-Null
          Check ($null -eq (Get-ItemProperty $run).GlucoBar) "glucobar set autostart=false"
          & $gb set autostart=true | Out-Null
          Check ($null -ne (Get-ItemProperty $run).GlucoBar) "glucobar set autostart=true"

          # glucobar report e il comando PowerShell di riserva del modulo "Bug report"
          $log = "$env:APPDATA\GlucoBar\glucobar.log"
          Add-Content $log "2026-01-01 10:00:00 primo dato ricevuto: 140 mg/dL"
          Add-Content $log "2026-01-01 10:00:01 errore per mario.rossi@example.com in $env:USERPROFILE\x"
          $rep = & $gb report --no-copy | Out-String
          $rep
          Check ($rep -match "GlucoBar diagnostic report" -and $rep -match "Windows 1\d") "glucobar report"
          Check ($rep -notmatch "example.com|140 mg/dL" -and $rep -notlike "*$env:USERPROFILE*") "glucobar report nasconde email, valori e utente"
          $form = Get-Content .github\ISSUE_TEMPLATE\bug_report.yml -Raw
          $cmd = [regex]::Match($form, '(?s)```powershell\s*\n\s*(.+?)\n\s*```').Groups[1].Value.Trim()
          $out = Invoke-Expression ($cmd -replace '\| Set-Clipboard$', '| Out-String')
          $out
          Check ($out -match "CurrentBuild" -and $out -match "<value> mg/dL") "comando PowerShell del modulo"
          Check ($out -notmatch "example.com|140 mg/dL" -and $out -notlike "*$env:USERPROFILE*") "il comando PowerShell nasconde email, valori e utente"

          # "Cancella tutto" deve cancellare davvero la password (0.3.0: tornava
          # dal file in chiaro della prima versione)
          cmdkey /generic:GlucoBar:LibreLinkUp /user:test@example.com /pass:segreta | Out-Null
          cmdkey /generic:GlucoBar:Dexcom /user:+391234567 /pass:segreta | Out-Null
          cmdkey /generic:GlucoBar:Nightscout /user:https://prova.example.org /pass:token | Out-Null
          '{"email": "test@example.com", "password": "in-chiaro"}' |
              Set-Content "$env:USERPROFILE\.glicemia_widget.json"
          & $gb forget | Out-Null
          $left = cmdkey /list:GlucoBar:LibreLinkUp | Out-String
          Check ($left -notmatch "test@example.com") "password tolta dal Gestione credenziali"
          $left = cmdkey /list:GlucoBar:Dexcom | Out-String
          Check ($left -notmatch "391234567") "password Dexcom tolta dal Gestione credenziali"
          $left = cmdkey /list:GlucoBar:Nightscout | Out-String
          Check ($left -notmatch "prova.example.org") "token Nightscout tolto dal Gestione credenziali"
          Check (-not (Test-Path "$env:APPDATA\GlucoBar")) "impostazioni cancellate"
          Check (-not (Test-Path "$env:USERPROFILE\.glicemia_widget.json")) "file della prima versione cancellato"

          # GlucoBar aperto: "glucobar stop" lo chiude, e la disinstallazione anche
          # (un sito Nightscout finto basta ad avviarlo senza chiedere l'account)
          function Running { $null -ne (Get-Process GlucoBar -ErrorAction SilentlyContinue) }
          New-Item -ItemType Directory -Force "$env:APPDATA\GlucoBar" | Out-Null
          '{"source": "nightscout", "email": "https://glucobar-test.invalid", "elements": ["window"], "language": "en"}' |
              Set-Content "$env:APPDATA\GlucoBar\config.json"
          Start-Process "$dir\GlucoBar.exe"
          Start-Sleep -Seconds 8
          Check (Running) "GlucoBar avviato"
          & $gb stop
          $code = $LASTEXITCODE
          Start-Sleep -Seconds 1
          Get-Content "$env:APPDATA\GlucoBar\glucobar.log" -ErrorAction SilentlyContinue | Select-Object -Last 6
          Check ($code -eq 0 -and -not (Running)) "glucobar stop chiude GlucoBar"
          Start-Process "$dir\GlucoBar.exe"
          Start-Sleep -Seconds 8
          Check (Running) "GlucoBar riaperto prima della disinstallazione"

          # disinstallazione: niente resti in PATH e avvio automatico
          $u = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList `
               "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Check ($u.ExitCode -eq 0) "disinstallazione (codice $($u.ExitCode))"
          Check (-not (Running)) "la disinstallazione chiude GlucoBar"
          Start-Sleep -Seconds 3
          Check (-not (Test-Path "$dir\GlucoBar.exe")) "file rimossi"
          $path = (Get-ItemProperty HKCU:\Environment).Path
          Check ($path -notlike "*$dir\bin*") "bin tolto dal PATH"
          Check ($null -eq (Get-ItemProperty $run).GlucoBar) "avvio con Windows tolto"

      - uses: actions/upload-artifact@v7
        with:
          name: GlucoBar-Setup-${{ steps.version.outputs.version }}
          path: dist-installer/*.exe

      # Scansione dell'installer su VirusTotal, con il link nel testo della release.
      # Serve il secret VT_API_KEY (chiave gratuita di virustotal.com); senza, si salta.
      - name: VirusTotal
        id: vt
        if: github.ref_type == 'tag' || inputs.release || inputs.scan
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          $setup = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          $url = python tools/virustotal.py --wait $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VirusTotal: $url"
          "url=$url" >> $env:GITHUB_OUTPUT

      # Solo per le prove: quale dei due eseguibili fa scattare gli antivirus
      - name: VirusTotal (executables)
        if: inputs.scan
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          foreach ($exe in "GlucoBar.exe", "glucobar-cli.exe") {
            python tools/virustotal.py --wait "dist\GlucoBar\$exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Release notes
        if: github.ref_type == 'tag' || inputs.release
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          python tools/release_notes.py ${{ steps.version.outputs.version }} release-notes.md `
                 $setup.FullName "${{ steps.vt.outputs.url }}" "${{ steps.vt.outputs.microsoft }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content release-notes.md

      # Copia con un nome fisso: .../releases/latest/download/GlucoBar-Setup.exe scarica
      # sempre l'ultima versione (in una cartella a parte: i passi sopra prendono il
      # primo .exe di dist-installer)
      - name: Installer with a fixed name
        if: github.ref_type == 'tag' || inputs.release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-latest | Out-Null
          $setup = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist-latest\GlucoBar-Setup.exe

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GlucoBar ${{ steps.version.outputs.version }}
          files: |
            dist-installer/*.exe
            dist-latest/GlucoBar-Setup.exe
          body_path: release-notes.md
          # Se Windows Defender segnala l'installer (falso positivo da segnalare a
          # Microsoft), esce come pre-release: i link "latest" restano sulla precedente
          prerelease: ${{ steps.vt.outputs.microsoft == 'true' }}
          make_latest: ${{ steps.vt.outputs.microsoft == 'true' && 'false' || 'true' }}

      - name: winget manifest
        if: github.ref_type == 'tag' || inputs.release
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          python tools/winget_manifest.py ${{ steps.version.outputs.version }} $setup.FullName winget

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag' || inputs.release
        with:
          name: winget-manifest-${{ steps.version.outputs.version }}
          path: winget/

  # Mac (beta): GlucoBar.app in un .dmg, con il valore nella barra dei menu. Dopo la
  # build di Windows, che crea la release: qui si aggiunge solo il .dmg
  macos:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Tests
        run: |
          # in caso di errore, il riassunto finisce negli avvisi del job
          if ! python -m unittest discover -s tests -v 2> tests.log; then
            cat tests.log
            python -c "import sys; t = open('tests.log').read(); e = t[t.find('====='):][-6000:]; print('::error title=Tests::' + e.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
            exit 1
          fi

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"
          else v=$(python -c "import glucobar; print(glucobar.__version__)"); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build GlucoBar.app
        run: |
          pyinstaller --noconfirm --clean glucobar.spec
          # firma "ad-hoc": senza, i Mac con chip Apple non aprono l'app
          codesign --force --deep --sign - dist/GlucoBar.app
          codesign --verify --deep --strict dist/GlucoBar.app

      # Come su Windows: tutte le parti caricate, poi l'app vera con un sito Nightscout
      # finto (foto della barra dei menu negli avvisi del job) e "glucobar stop"
      - name: Smoke test
        run: |
          app=dist/GlucoBar.app/Contents/MacOS
          if ! "$app/GlucoBar" --self-test; then
            cat "$HOME/Library/Application Support/GlucoBar/glucobar.log"; exit 1
          fi
          "$app/glucobar-cli" --version
          python tools/mac_smoke.py dist/GlucoBar.app

      - name: Disk image
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p dmg dist-mac
          cp -R dist/GlucoBar.app dmg/
          ln -s /Applications dmg/Applications   # trascina GlucoBar su Applicazioni
          hdiutil create -volname GlucoBar -srcfolder dmg -ov -format UDZO "dist-mac/GlucoBar-$v-mac.dmg"
          # nome fisso: .../releases/latest/download/GlucoBar-mac.dmg
          cp "dist-mac/GlucoBar-$v-mac.dmg" dist-mac/GlucoBar-mac.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: GlucoBar-${{ steps.version.outputs.version }}-mac
          path: dist-mac/GlucoBar-${{ steps.version.outputs.version }}-mac.dmg

      - name: Add to the release
        if: github.ref_type == 'tag' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.version.outputs.version }}" dist-mac/*.dmg --clobber
