name: Taskbar edges test

# Valore sulla barra con la barra nascosta automaticamente e su ogni bordo, su Windows 11
# e su Windows 10 (che permette la barra in alto, a sinistra e a destra). Da sorgente.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edges:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Taskbar edges test
        run: python tools/win_taskbar_edges_test.py run_glucobar.py --strict
