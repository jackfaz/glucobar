name: Taskbar edges test

# Valore sulla barra con la barra nascosta automaticamente e su ogni bordo, su Windows 11
# e su Windows 10 (che permette la barra in alto, a sinistra e a destra). Da sorgente.
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Run this tag or commit of GlucoBar instead (e.g. v0.9.5)"
        default: ""

permissions:
  contents: read

jobs:
  edges:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Taskbar edges test
        shell: pwsh
        run: |
          $app = "run_glucobar.py"
          if ("${{ inputs.app_ref }}") {
            git fetch -q --tags origin
            git worktree add -q app "${{ inputs.app_ref }}"
            $app = "app\run_glucobar.py"
          }
          python tools/win_taskbar_edges_test.py $app --strict
          if ($LASTEXITCODE -ne 0) { exit 1 }
