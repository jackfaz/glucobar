name: Soak test

# GlucoBar aperto a lungo, con letture ogni 10 secondi e cambi di tema: memoria, handle e
# oggetti grafici non devono crescere (vedi tools/win_soak_test.py). Ogni settimana e a
# mano da Actions (Run workflow), scegliendo la durata.
on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep GlucoBar running (minutes)"
        default: "60"

permissions:
  contents: read

jobs:
  soak:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt psutil "pyinstaller>=6.10,<7"

      - name: Build GlucoBar.exe
        run: pyinstaller --noconfirm --clean glucobar.spec

      - name: Soak test
        run: python tools/win_soak_test.py dist\GlucoBar\GlucoBar.exe ${{ inputs.minutes || '60' }}
