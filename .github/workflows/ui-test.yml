name: UI test

# Prova veloce su Windows, da sorgente e senza compilare: valore sulla barra (visibile,
# clic destro, menu). La stessa prova gira anche nella build, sull'exe.
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Run this tag or commit of GlucoBar instead (e.g. v0.8.4)"
        default: ""

permissions:
  contents: read

jobs:
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Taskbar value test
        shell: pwsh
        run: |
          $app = "run_glucobar.py"
          if ("${{ inputs.app_ref }}") {
            git fetch -q --tags origin
            git worktree add -q app "${{ inputs.app_ref }}"
            $app = "app\run_glucobar.py"
          }
          python tools/win_taskbar_test.py $app --strict
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Tray menu test
        if: always()
        shell: pwsh
        run: |
          $app = "run_glucobar.py"
          if ("${{ inputs.app_ref }}") { $app = "app\run_glucobar.py" }
          python tools/win_tray_test.py $app --strict
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Alert sounds test
        if: always()
        run: python tools/win_sound_test.py --strict
